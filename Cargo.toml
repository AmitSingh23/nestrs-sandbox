[package]
name = "nestrs-app"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
chrono = "0.4.45"
feed-rs = "3.0.0"
linkme = "0.3.37"
nestrs = { version = "1.6.0", features = ["queues", "schedule", "sea-orm"] }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
